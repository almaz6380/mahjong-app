name: iOS einreichen

# Schickt eine hochgeladene Version zur App-Pruefung. Laeuft auf Linux — die
# ASC-API braucht keinen Mac, anders als der Build.
#
# Vorher muss der Build per „iOS Release" hochgeladen UND von Apple verarbeitet
# sein (dauert nach dem Upload meist ein paar Minuten). Ist er das noch nicht,
# findet ihn das Skript nicht und bricht ab — dann einfach spaeter nochmal.
#
# ⚠ `submit: false` (Standard) ist ein reiner Trockenlauf: Das Skript zeigt, was
# es taete, und sendet NICHTS. Das Einreichen ist der einzige Schritt, der sich
# nicht ohne Weiteres zurueckholen laesst (nur ueber scripts/asc-cancel.py, und
# das kostet die Warteposition in der Pruefschlange).
#
# Der .p8-Schluessel wird aus dem base64-Secret dekodiert und nur als
# Umgebungsvariable weitergereicht, nie in eine Datei geschrieben.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 1.1.0 (muss zur CFBundleShortVersionString des Builds passen)'
        type: string
        required: true
      build:
        description: 'Build-Nummer, z. B. 22'
        type: string
        required: true
      notes_file:
        description: '„Was ist neu"-Texte je Sprache'
        type: string
        default: 'store/whatsnew-1.1.0.json'
      rename_from:
        description: 'Vorhandene editierbare Version umbenennen (leer lassen, wenn nicht noetig)'
        type: string
        default: ''
      submit:
        description: 'Wirklich einreichen? (aus = Trockenlauf, sendet nichts)'
        type: boolean
        default: false
      nur_status:
        description: 'Nur nachsehen: Versionen, Builds, offene Pruefungen (schreibt nie)'
        type: boolean
        default: false
      zuerst_abbrechen:
        description: 'Laufende Pruefung abbrechen (KOSTET die Warteposition!) — noetig, wenn eine aeltere Version haengt'
        type: boolean
        default: false
      screenshots:
        description: 'Store-Screenshots vorher ersetzen (loescht die alten bei Apple)'
        type: boolean
        default: false
      texte:
        description: 'Store-Texte + URLs (store-texte.json, asc-texte.py) vor dem Einreichen setzen'
        type: boolean
        default: true
      iap:
        description: 'In-App-Käufe (READY_TO_SUBMIT) mit dieser Version zur Prüfung schicken'
        type: boolean
        default: false
      kopfzeile:
        description: 'Kopfzeile + Suchergebnis-Bild aus der Mediathek zuordnen (asc-kopfzeile.py)'
        type: boolean
        default: false
      laeufer:
        description: 'Wo laufen? github = GitHub-Rechner (kostet Minuten), mac = eigener Mac (Self-hosted Runner)'
        type: choice
        default: 'github'
        options: ['github', 'mac']

permissions:
  contents: read

jobs:
  einreichen:
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        # Eigene venv unter RUNNER_TEMP: auf dem Mac verweigert das
        # System-Python ein pip install, und in Josefs Python soll nichts landen.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Zur Pruefung schicken
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          V: ${{ inputs.version }}
          B: ${{ inputs.build }}
          NOTES: ${{ inputs.notes_file }}
          RENAME: ${{ inputs.rename_from }}
          SUBMIT: ${{ inputs.submit }}
          NUR_STATUS: ${{ inputs.nur_status }}
          ABBRECHEN: ${{ inputs.zuerst_abbrechen }}
          SHOTS: ${{ inputs.screenshots }}
          TEXTE: ${{ inputs.texte }}
          KOPFZEILE: ${{ inputs.kopfzeile }}
          IAP: ${{ inputs.iap }}
        run: |
          set -euo pipefail
          ASC_KEY_P8=$(printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d)
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8_BASE64 laesst sich nicht dekodieren."
            exit 1
          fi
          export ASC_KEY_P8

          # Apple erlaubt nur EINE Version in Arbeit. Steht schon eine da,
          # scheitert das Anlegen mit 409 — dann muss man wissen, welche es ist,
          # bevor man `rename_from` setzt. Genau dafuer dieser Weg.
          if [ "$NUR_STATUS" = "true" ]; then
            python3 scripts/asc-status.py
            exit 0
          fi

          test -f "$NOTES" || { echo "::error::$NOTES gibt es nicht."; exit 1; }

          ARGS="--version $V --build $B --notes-file $NOTES"
          [ -n "$RENAME" ] && ARGS="$ARGS --rename-from $RENAME"

          # --- 1. Laufende Pruefung abbrechen -------------------------------
          # Danach faellt die Version auf DEVELOPER_REJECTED und ist wieder
          # editierbar — erst dann greift --rename-from. Der Uebergang
          # CANCELING -> COMPLETE dauert ein bis zwei Minuten, deshalb pollen
          # statt blind weiterzumachen.
          #
          # ⚠ Dieser Schritt haengt am EIGENEN Schalter, nicht an `submit`.
          # Bis 11.8.2026 stand die Trockenlauf-Abkuerzung darueber: Ein Lauf mit
          # zuerst_abbrechen=true und submit=false meldete „TROCKENLAUF" und
          # brach ab, OHNE abzubrechen — die Pruefung lief einfach weiter, und
          # der naechste Schritt scheiterte an gesperrten Metadaten. Das sah wie
          # ein Problem bei Apple aus und war eine Zeile Ablaufsteuerung.
          #
          # „Nur abbrechen" ist ausdruecklich ein sinnvoller Lauf: Zwischen
          # Abbruch und Einreichung gehoert die Metadaten-Arbeit (Beschreibung,
          # Screenshots) — solange die Pruefung laeuft, sperrt Apple sie.
          if [ "$ABBRECHEN" = "true" ]; then
            echo "::warning::Die laufende Pruefung wird abgebrochen — die Warteposition ist damit weg."
            python3 scripts/asc-cancel.py --yes
            for i in $(seq 1 20); do
              if python3 scripts/asc-status.py | grep -qE 'PREPARE_FOR_SUBMISSION|DEVELOPER_REJECTED'; then
                echo "Version ist wieder editierbar (nach $((i * 15)) s)."
                break
              fi
              if [ "$i" = "20" ]; then
                echo "::error::Version wurde binnen 5 min nicht editierbar."
                exit 1
              fi
              sleep 15
            done
          fi

          # Ohne `submit` endet der Lauf hier: Ein etwaiger Abbruch ist erledigt,
          # geschrieben oder eingereicht wird nichts. Der Aufruf ohne Argumente
          # zeigt nur, wie die Version jetzt dasteht.
          if [ "$SUBMIT" != "true" ]; then
            echo "Kein --submit: es wird nichts geschrieben und nichts eingereicht."
            python3 scripts/asc-submit.py $ARGS
            exit 0
          fi

          # --- 2. Schreiben, aber noch NICHT einreichen ---------------------
          # Die Screenshots muessen dazwischen: Sobald die Version in der
          # Pruefung ist, sperrt Apple die Metadaten.
          python3 scripts/asc-submit.py $ARGS --vorbereiten

          # --- 2b. Store-Texte und URLs -------------------------------------
          # Datenschutz-, Marketing- und Support-URL haengen an der offenen
          # Version bzw. am appInfo und sind nach dem Einreichen gesperrt.
          # Seit dem 04.10.2026 (Vercel gesperrt) zeigen sie auf github.io.
          if [ "$TEXTE" = "true" ]; then
            python3 scripts/asc-texte.py --schreiben
          fi

          # --- 3. Screenshots ------------------------------------------------
          if [ "$SHOTS" = "true" ]; then
            python3 scripts/upload-ios-screenshots.py --ersetzen
          fi

          # --- 3b. Kopfzeile -------------------------------------------------
          # Placements gehen nur auf eine BEARBEITBARE Version — also genau hier,
          # zwischen Vorbereiten und Einreichen.
          if [ "$KOPFZEILE" = "true" ]; then
            python3 scripts/asc-kopfzeile.py --zuordnen --schreiben
          fi

          # --- 3c. In-App-Käufe ---------------------------------------------
          # Die ersten Käufe prüft Apple nur zusammen mit einer Version (1.4.1
          # wurde am 15.10.2026 genau deshalb nach 2.1(b) abgelehnt).
          if [ "$IAP" = "true" ]; then
            python3 scripts/asc-iap.py --einreichen
          fi

          # --- 4. Einreichen -------------------------------------------------
          # Dieselbe Version, die Schritt 2 vorbereitet hat — sie existiert
          # jetzt und ist editierbar, --rename-from laeuft dabei ins Leere.
          python3 scripts/asc-submit.py $ARGS --submit
