# iOS bauen, signieren und zu App Store Connect hochladen — auf einem macOS-Rechner
# von GitHub. Damit braucht ein Release keinen eigenen Mac mehr.
#
# Einmalige Einrichtung: siehe store/ci-setup.md (vier Secrets).
# WICHTIG: CURRENT_PROJECT_VERSION in ios/App/App.xcodeproj/project.pbxproj vorher
# erhöhen (2 Stellen) — Apple lehnt eine bereits benutzte Build-Nummer ab.
#
# Hinweis: macOS-Läufer verbrauchen 10× so viele Minuten wie Linux. Der Lauf
# dauert ~15-25 min. Das Einreichen zur Prüfung bleibt bewusst manuell.
#
# Laeufer „mac" = Josefs eigener Mac als Self-hosted Runner: kostet keine
# GitHub-Minuten. Weil der Lauf dort auf einem PRIVATEN Rechner stattfindet,
# fasst er nichts Eigenes an: Wegwerf-Schluesselbund unter $RUNNER_TEMP (der
# Standard-Schluesselbund bleibt, die Suchliste wird wiederhergestellt), Profil
# unter eindeutigem Namen, API-Schluessel nie unter ~/.appstoreconnect.
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Wirklich zu App Store Connect hochladen? (aus = nur bauen)'
        type: boolean
        default: true
      laeufer:
        description: 'Wo bauen? github = GitHub-Rechner (kostet Minuten), mac = eigener Mac (Self-hosted Runner)'
        type: choice
        default: 'github'
        options: ['github', 'mac']

permissions:
  contents: read

jobs:
  build:
    # macos-26 bringt Xcode 26 mit. Apple verlangt seit 2026 mindestens das
    # iOS-26-SDK für Uploads (sonst Fehler 90725) — ein älterer Läufer baut zwar
    # durch, scheitert aber beim Hochladen.
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Xcode und CocoaPods pruefen
        # Auf GitHubs Rechnern ist beides da; auf dem eigenen Mac nicht zwingend.
        run: |
          X=$(xcodebuild -version | head -1)
          echo "$X"
          MAJOR=$(printf '%s' "$X" | awk '{print $2}' | cut -d. -f1)
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "ABBRUCH: Xcode 26 oder neuer noetig (Apple-Fehler 90725 beim Upload)."
            exit 1
          fi
          if ! command -v pod >/dev/null 2>&1; then
            echo "ABBRUCH: CocoaPods fehlt. Am Mac einmal: brew install cocoapods"
            exit 1
          fi
          echo "CocoaPods $(pod --version)"

      - name: Abhängigkeiten
        run: npm ci

      - name: Prüfungen
        run: |
          npx tsc --noEmit
          node scripts/check-figures.mjs

      - name: Build-Nummer anzeigen
        run: |
          B=$(grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj | tr -dc '0-9')
          V=$(grep -m1 MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj | cut -d'=' -f2 | tr -d ' ;')
          echo "Version $V · Build $B"
          echo "B=$B" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Web-Bundle + Capacitor-Sync
        run: |
          npm run build
          npx cap sync ios

      - name: Signierung einrichten
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Eigener Wegwerf-Schluesselbund unter $RUNNER_TEMP. NIE
          # `security default-keychain -s` — auf dem eigenen Mac wuerde das den
          # persoenlichen Schluesselbund als Standard verdraengen.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          # Bisherige Suchliste merken, der Aufraeumschritt stellt sie wieder her.
          security list-keychains -d user | sed 's/"//g' | xargs > "$RUNNER_TEMP/keychains-vorher.txt"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/keychains-vorher.txt")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mahjong-ci.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: ExportOptions schreiben
        run: |
          set -euo pipefail
          # Bei manueller Signierung verlangt xcodebuild beim Export die
          # Zuordnung Bundle-ID -> Profilname. Beides steht im Profil selbst,
          # also lesen wir es dort aus, statt es fest einzutippen. Ohne diesen
          # Block bricht der Export mit "requires a provisioning profile" ab.
          PROFIL="$HOME/Library/MobileDevice/Provisioning Profiles/mahjong-ci.mobileprovision"
          security cms -D -i "$PROFIL" > "$RUNNER_TEMP/profil.plist"
          NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/profil.plist")
          APPID=$(plutil -extract Entitlements.application-identifier raw -o - "$RUNNER_TEMP/profil.plist")
          BUNDLE=${APPID#*.}
          echo "Profil \"$NAME\" fuer $BUNDLE"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>JU8STVD4SJ</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE</key><string>$NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          rm -f "$RUNNER_TEMP/profil.plist"

      - name: Archivieren
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      - name: Exportieren
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - name: IPA als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: MahjongRoyale-ios-${{ env.V }}-b${{ env.B }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Zu App Store Connect hochladen
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # Nicht nach ~/.appstoreconnect: Auf dem eigenen Mac koennen dort eigene
          # Schluessel liegen, und ein `rm -rf` naehme sie mit. altool sucht
          # zusaetzlich in API_PRIVATE_KEYS_DIR.
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf "$API_PRIVATE_KEYS_DIR"

      - name: Aufraeumen
        # Auf GitHubs Rechnern egal (die Maschine wird verworfen), auf dem
        # eigenen Mac nicht: nichts darf liegen bleiben.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/keychains-vorher.txt" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-vorher.txt")
          fi
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/mahjong-ci.mobileprovision
          rm -rf "$RUNNER_TEMP/asc-keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/export" \
                 "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/ExportOptions.plist" \
                 "$RUNNER_TEMP/profil.plist" "$RUNNER_TEMP/keychains-vorher.txt"
