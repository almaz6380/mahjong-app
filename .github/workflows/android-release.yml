# Android bauen, signieren und zu Google Play hochladen — auf GitHubs Rechnern.
# Damit braucht ein Release keinen Mac mehr und lässt sich aus jeder Claude-Sitzung
# auslösen (Actions -> "Android Release" -> Run workflow).
#
# Einmalige Einrichtung: siehe store/ci-setup.md (fünf Secrets).
# WICHTIG: versionCode in android/app/build.gradle vorher erhöhen — Play lehnt
# einen bereits benutzten versionCode ab.
name: Android Release

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: 'An wie viele Nutzer veröffentlichen?'
        type: choice
        default: 'complete'
        options: ['complete', '0.2', '0.5']
      notes:
        description: 'Was-ist-neu-Text (de-DE)'
        type: string
        default: 'Fehlerkorrekturen und Verbesserungen.'
      upload:
        description: 'Wirklich zu Play hochladen? (aus = nur bauen und als Artefakt ablegen)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'   # AGP 8.2.1 braucht mindestens 17

      - name: Abhängigkeiten
        run: npm ci

      - name: Prüfungen
        run: |
          npx tsc --noEmit
          node scripts/check-figures.mjs

      - name: Versionsnummer anzeigen
        run: |
          VC=$(grep -m1 versionCode android/app/build.gradle | tr -dc '0-9')
          VN=$(grep -m1 versionName android/app/build.gradle | cut -d'"' -f2)
          echo "versionCode $VC · versionName $VN"
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      - name: Web-Bundle + Capacitor-Sync
        run: |
          npm run build
          npx cap sync android

      # Zeigt, WELCHE Secrets der Workflow überhaupt sieht — nur die Namen, nie
      # die Werte. Hilft beim Verwechseln der Bereiche: Actions-Secrets des Repos
      # sind etwas anderes als Dependabot-, Codespaces- oder Environment-Secrets.
      - name: Sichtbare Secret-Namen
        env:
          NAMEN: ${{ toJSON(secrets) }}
        run: |
          echo "Im Workflow sichtbar:"
          echo "$NAMEN" | jq -r 'keys[]' | sed 's/^/  · /'

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fehlt=""
          [ -n "$KEYSTORE_B64" ]  || fehlt="$fehlt ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || fehlt="$fehlt ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || fehlt="$fehlt ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || fehlt="$fehlt ANDROID_KEY_PASSWORD"
          if [ -n "$fehlt" ]; then
            echo "ABBRUCH: Diese Secrets fehlen im Repo:$fehlt"
            echo "Anleitung: store/ci-setup.md (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          # Grobprüfung, bevor Gradle vier Minuten später am Signieren scheitert.
          # Ein echter Upload-Keystore ist einige Kilobyte groß und beginnt mit der
          # JKS-Kennung 0xFEEDFEED bzw. ist ein PKCS#12-Container.
          bytes=$(wc -c < android/upload-keystore.jks)
          echo "Keystore entschlüsselt: $bytes Bytes"
          if [ "$bytes" -lt 512 ]; then
            echo "ABBRUCH: Das ist kein Keystore. ANDROID_KEYSTORE_BASE64 enthält nicht die"
            echo "Datei android/upload-keystore.jks. Am Mac erzeugen mit:"
            echo "  base64 -i android/upload-keystore.jks | pbcopy"
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: AAB bauen
        run: cd android && ./gradlew --no-daemon bundleRelease

      # Prueft den Schalter selbst statt im fertigen Paket nach einer Zeichenkette
      # zu suchen. Die alte Fassung durchsuchte base/dex/classes.dex und schlug
      # dort an, obwohl USE_TEST_ADS auf false steht: Googles Anzeigen-SDK bringt
      # dieselben Beispiel-IDs in seinem EIGENEN Java-Code mit. Unsere IDs stehen
      # in src/ads/admob.ts und landen im Web-Bundle, nie im dex — die Prueffrage
      # war also von vornherein an der falschen Stelle gestellt.
      - name: Keine Test-Werbe-IDs im Release
        run: |
          if ! grep -q 'const USE_TEST_ADS = false' src/ads/admob.ts; then
            echo "ABBRUCH: USE_TEST_ADS steht nicht auf false — es wuerden"
            echo "Google-Test-Anzeigen ausgeliefert (also null Einnahmen)."
            exit 1
          fi
          echo "ok — echte Anzeigen-IDs"

      # Nur zur Information, bricht nie ab: zeigt, WO die Test-Zeichenkette im
      # Paket steckt. Steht sie ausschliesslich im dex (SDK/Plugin), ist alles in
      # Ordnung; taucht sie im Web-Bundle unter base/assets/public auf, wirft der
      # Bundler den inaktiven TEST-Block doch nicht weg — dann hier nachschaerfen.
      - name: Diagnose — wo steckt die Test-Zeichenkette?
        if: always()
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "kein AAB vorhanden"; exit 0; }
          rm -rf /tmp/aab && mkdir -p /tmp/aab && unzip -q -o "$AAB" -d /tmp/aab
          echo "### Google-TEST-ID (3940256099942544):"
          grep -rla '3940256099942544' /tmp/aab | sed 's|/tmp/aab/|  · |' || echo "  (kein Treffer)"
          echo
          echo "### Unsere echte Publisher-ID (8860791993288062):"
          grep -rla '8860791993288062' /tmp/aab | sed 's|/tmp/aab/|  · |' || echo "  (kein Treffer)"
          echo
          echo "### Web-Bundle im Paket:"
          ls -1 /tmp/aab/base/assets/public/assets/*.js 2>/dev/null | sed 's|.*/|  · |' | head -5 || echo "  (nicht gefunden)"

      - name: AAB als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: MahjongRoyale-${{ env.VN }}-vc${{ env.VC }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Zu Google Play hochladen
        if: ${{ inputs.upload }}
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ROLLOUT: ${{ inputs.rollout }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Eigene venv: neuere Ubuntu-Läufer erlauben kein pip3 install ins
          # System-Python (PEP 668, "externally managed environment").
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyjwt cryptography
          printf '%s' "$PLAY_KEY_JSON" > /tmp/play-key.json
          if [ "$ROLLOUT" = "complete" ]; then ARG="--complete"; else ARG="--fraction $ROLLOUT"; fi
          PLAY_KEY=/tmp/play-key.json /tmp/venv/bin/python scripts/play-upload.py \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            $ARG --notes "$NOTES"
          rm -f /tmp/play-key.json

      - name: Schlüssel aufräumen
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties /tmp/play-key.json
