# Baut die App „Tagebuch – Mein Journal“ (Repo almaz6380/Tagebuch) und bringt
# sie in die Stores. Liegt hier, weil hier die Signier- und Store-Schlüssel als
# Secrets hinterlegt sind — dasselbe Apple-Distributionszertifikat, derselbe
# ASC-Schlüssel, derselbe Android-Upload-Schlüssel und dasselbe Play-Dienstkonto
# wie für Mahjong. An Mahjong selbst ändert dieser Workflow nichts.
#
# Ablauf und Skripte stammen aus dem Tagebuch-Repo (ios-release.yml,
# android-release.yml, scripts/asc.py, scripts/play.py); nur von Hand startbar.
name: Tagebuch Release

on:
  workflow_dispatch:
    inputs:
      plattform:
        description: 'Welche Plattform?'
        type: choice
        default: beide
        options: [beide, ios, android]
      upload:
        description: 'In die Stores hochladen? (aus = nur bauen)'
        type: boolean
        default: true
      einreichen:
        description: 'iOS: nach dem Upload Texte + Screenshots setzen und zur Prüfung senden?'
        type: boolean
        default: true
      track:
        description: 'Android-Track (production, oder alpha = geschlossener Test)'
        type: choice
        default: production
        options: [production, alpha, internal]
      notes:
        description: 'Android: Was ist neu (leer = Texte je Sprache aus store/texte.json)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ios:
    if: ${{ inputs.plattform != 'android' }}
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tagebuch
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: almaz6380/Tagebuch
          ref: main
          path: tagebuch

      - uses: actions/setup-node@v4
        with:
          node-version-file: tagebuch/.node-version
          cache: npm
          cache-dependency-path: tagebuch/package-lock.json

      - name: Abhängigkeiten
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Prüfungen
        run: npm run lint && npm run typecheck

      - name: Versionsnummern
        run: |
          # +100: Abstand zu den Laufnummern der Workflows im Tagebuch-Repo selbst.
          export BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.ios.buildNumber = process.env.BUILD;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Version', app.expo.version, 'Build', app.expo.ios.buildNumber);
          "

      - name: Natives Projekt erzeugen
        run: CI=1 npx expo prebuild -p ios --clean

      - name: Signierung einrichten
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          # App-Store-Profil für genau dieses Zertifikat, frisch per API.
          PROFIL="$HOME/Library/MobileDevice/Provisioning Profiles/tagebuch-ci.mobileprovision"
          mkdir -p "$(dirname "$PROFIL")"
          python3 scripts/asc.py profil --p12 "$RUNNER_TEMP/cert.p12" --ausgabe "$PROFIL" --ausfuehren
          rm -f "$RUNNER_TEMP/cert.p12"
          security cms -D -i "$PROFIL" > "$RUNNER_TEMP/profil.plist"
          echo "PROFIL_NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/profil.plist")" >> "$GITHUB_ENV"
          echo "TEAM=$(plutil -extract TeamIdentifier.0 raw -o - "$RUNNER_TEMP/profil.plist")" >> "$GITHUB_ENV"

      - name: Manuelle Signierung im App-Target
        run: |
          # Nur das App-Target bekommt das Profil; die Pods-Targets bleiben unsigniert.
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open(Dir["ios/*.xcodeproj"].first)
            target = project.targets.find { |t| t.product_type == "com.apple.product-type.application" }
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM"]
              c.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFIL_NAME"]
            end
            project.save
            puts "Signierung gesetzt für #{target.name}"
          '
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.almaz6380.tagebuch</key><string>$PROFIL_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archivieren
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      - name: Exportieren
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Zu App Store Connect hochladen
        if: ${{ inputs.upload }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_KEY_P8" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf "$API_PRIVATE_KEYS_DIR"

      - name: Zur Prüfung einreichen
        if: ${{ inputs.upload && inputs.einreichen }}
        run: |
          python3 scripts/asc.py warten --build "$BUILD"
          python3 scripts/asc.py metadaten --ausfuehren
          python3 scripts/asc.py iap --ausfuehren
          python3 scripts/asc.py einreichen --build "$BUILD" --ausfuehren

      - name: Aufräumen
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc-keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profil.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/tagebuch-ci.mobileprovision"

  android:
    if: ${{ inputs.plattform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tagebuch
    steps:
      - uses: actions/checkout@v4
        with:
          repository: almaz6380/Tagebuch
          ref: main
          path: tagebuch

      - uses: actions/setup-node@v4
        with:
          node-version-file: tagebuch/.node-version
          cache: npm
          cache-dependency-path: tagebuch/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Abhängigkeiten
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Prüfungen
        run: npm run lint && npm run typecheck

      - name: Versionsnummern
        run: |
          # +100: Abstand zu den Laufnummern der Workflows im Tagebuch-Repo selbst.
          export BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.BUILD);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Version', app.expo.version, 'versionCode', app.expo.android.versionCode);
          "

      - name: Natives Projekt erzeugen
        run: CI=1 npx expo prebuild -p android --clean

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/upload.keystore
          # Gelesen von plugins/withReleaseSigning.js im Tagebuch-Repo; Pfade relativ zu android/.
          cat > android/keystore.properties <<EOF
          storeFile=upload.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: AAB bauen
        run: cd android && ./gradlew --no-daemon bundleRelease

      - name: Signatur prüfen
        run: |
          # Ein mit dem Debug-Schlüssel signiertes Bundle würde Play ablehnen.
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/cert.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/cert.txt"; then echo "ABBRUCH: mit Debug-Schlüssel signiert"; exit 1; fi

      - name: Store-Eintrag und Release
        if: ${{ inputs.upload }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ inputs.notes }}
        run: |
          python3 scripts/play.py eintrag --ausfuehren
          python3 scripts/play.py release --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track "${{ inputs.track }}" --notes "$NOTES" --ausfuehren
          # Play lets you create a product only once a build with the billing permission is uploaded.
          python3 scripts/play.py produkt --ausfuehren

      - name: Schlüssel aufräumen
        if: always()
        run: rm -f android/upload.keystore android/keystore.properties
