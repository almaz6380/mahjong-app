<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#103a2b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./pwa-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mahjong Royale</title>
    <style>
      /* Ladebildschirm – paint sofort (vor dem JS-Bundle). Wird von main.tsx nach
         dem Vorladen der Bilder ausgeblendet und entfernt. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0c211b url("/splash.webp") center top / cover no-repeat;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        text-align: center;
        padding: 0 26px calc(env(safe-area-inset-bottom, 0px) + 40px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-title {
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
        font-weight: 700; font-size: 30px; letter-spacing: 0.14em;
        color: #f4ecd8; text-shadow: 0 2px 10px rgba(0,0,0,0.6); margin-bottom: 6px;
      }
      #splash-tag { font-size: 14px; color: #cdbb8a; letter-spacing: 0.06em; margin-bottom: 30vh; }
      #splash-tip {
        font-size: 13.5px; line-height: 1.5; color: #a9c4b3; max-width: 30ch;
        min-height: 3em; margin-bottom: 16px; transition: opacity 0.3s ease;
      }
      #splash-bar {
        width: min(240px, 70%); height: 6px; border-radius: 99px;
        background: rgba(255,255,255,0.14); overflow: hidden;
      }
      #splash-bar-fill {
        display: block; height: 100%; width: 0%; border-radius: 99px;
        background: linear-gradient(90deg, #c9962a, #e6b74a);
        transition: width 0.35s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash-bar-fill, #splash-tip { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-title">MAHJONG ROYALE</div>
      <div id="splash-tag">Steinepracht im Nebel</div>
      <div id="splash-tip"></div>
      <div id="splash-bar"><i id="splash-bar-fill"></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
